<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">GeoSweep</title>
  <desc id="d">A garbage truck drives along a city road toward a housing society. When it comes within 500 metres, a radar ring pulses and a notification appears.</desc>
  <defs>
    <path id="road" d="M -40 335 C 220 335, 330 290, 560 305 S 900 350, 1240 275"/>
    <clipPath id="frame"><rect width="1200" height="400" rx="22"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#E8EFF4"/>
    <!-- city blocks -->
    <g fill="#D8E3EA">
      <rect x="20" y="20" width="150" height="90" rx="8"/><rect x="190" y="320" width="120" height="70" rx="8" opacity=".0"/>
      <rect x="700" y="30" width="110" height="70" rx="8"/><rect x="1010" y="40" width="160" height="110" rx="8"/>
      <rect x="1040" y="330" width="130" height="60" rx="8"/><rect x="380" y="350" width="170" height="40" rx="8"/>
      <rect x="610" y="350" width="150" height="40" rx="8"/><rect x="30" y="360" width="120" height="30" rx="8"/>
    </g>
    <rect x="1000" y="170" width="170" height="80" rx="40" fill="#CDE5D6"/>
    <!-- road -->
    <use xlink:href="#road" href="#road" fill="none" stroke="#BFCCD6" stroke-width="42" stroke-linecap="round"/>
    <use xlink:href="#road" href="#road" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
    <use xlink:href="#road" href="#road" fill="none" stroke="#C3CFD9" stroke-width="2.5" stroke-dasharray="16 14">
      <animate attributeName="stroke-dashoffset" from="0" to="-30" dur="1s" repeatCount="indefinite"/>
    </use>

    <!-- society + geofence -->
    <g transform="translate(930 215)">
      <circle r="150" fill="#F59E0B" fill-opacity=".07" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="6 7"/>
      <path d="M0 0 L150 0 A150 150 0 0 0 129.9 -75 Z" fill="#F59E0B" fill-opacity=".28">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </path>
      <circle r="12" fill="none" stroke="#F59E0B" stroke-width="2.5">
        <animate attributeName="r" values="12;150" dur="2.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".85;0" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle r="12" fill="none" stroke="#F59E0B" stroke-width="2.5">
        <animate attributeName="r" values="12;150" dur="2.7s" begin="0.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".85;0" dur="2.7s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle r="12" fill="none" stroke="#F59E0B" stroke-width="2.5">
        <animate attributeName="r" values="12;150" dur="2.7s" begin="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".85;0" dur="2.7s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
      <!-- buildings -->
      <g fill="#0F2A43">
        <rect x="-34" y="-22" width="22" height="40" rx="2"/><rect x="-8" y="-36" width="24" height="54" rx="2"/><rect x="20" y="-16" width="20" height="34" rx="2"/>
      </g>
      <g fill="#FCD34D">
        <rect x="-29" y="-15" width="4" height="4"/><rect x="-29" y="-5" width="4" height="4"/><rect x="-3" y="-29" width="4" height="4"/>
        <rect x="6" y="-19" width="4" height="4"/><rect x="-3" y="-9" width="4" height="4"/><rect x="25" y="-8" width="4" height="4"/>
      </g>
      <text x="0" y="40" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#7C5200">Registered society</text>
      <text x="0" y="-158" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#B45309">500 m geofence</text>
    </g>

    <!-- truck -->
    <g>
      <animateMotion dur="10s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#road" href="#road"/></animateMotion>
      <circle r="8" fill="none" stroke="#0F766E" stroke-width="2">
        <animate attributeName="r" values="8;30" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".8;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <g transform="scale(1.35)">
        <rect x="-24" y="-9" width="30" height="18" rx="3" fill="#0F766E"/>
        <rect x="8" y="-8" width="16" height="16" rx="3" fill="#14B8A6"/>
        <rect x="15" y="-5.5" width="6" height="11" rx="1.5" fill="#E8EFF4"/>
        <circle cx="-14" cy="10" r="4" fill="#0F2A43"/><circle cx="14" cy="10" r="4" fill="#0F2A43"/>
        <circle cx="-14" cy="-10" r="4" fill="#0F2A43"/><circle cx="14" cy="-10" r="4" fill="#0F2A43"/>
      </g>
    </g>

    <!-- alert pill -->
    <g opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.58;0.62;0.9;0.94;1" values="0;0;1;1;0;0"/>
      <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" keyTimes="0;0.58;0.64;1" values="0 10;0 10;0 0;0 0"/>
      <rect x="660" y="92" width="262" height="46" rx="23" fill="#0F2A43"/>
      <circle cx="686" cy="115" r="9" fill="#F59E0B"/>
      <path d="M686 109 v7 M686 119 v.5" stroke="#0F2A43" stroke-width="2" stroke-linecap="round"/>
      <text x="706" y="121" class="sans" font-size="16" font-weight="600" fill="#FFFFFF">Truck is 500 m away</text>
    </g>

    <!-- copy -->
    <text x="70" y="140" class="sans" font-size="92" font-weight="800" letter-spacing="-3" fill="#0F2A43">GeoSweep</text>
    <text x="74" y="188" class="sans" font-size="26" font-weight="600" fill="#334E68">Tamper-proof tracking for waste collection trucks.</text>
    <text x="74" y="222" class="sans" font-size="20" fill="#486581">Citizens get an alert only when the truck is 500 m away.</text>
    <g class="sans" font-size="15" font-weight="600">
      <rect x="74" y="246" width="130" height="32" rx="16" fill="#FFFFFF" stroke="#BFCCD6"/><text x="139" y="267" text-anchor="middle" fill="#0F2A43">No driver phone</text>
      <rect x="214" y="246" width="136" height="32" rx="16" fill="#FFFFFF" stroke="#BFCCD6"/><text x="282" y="267" text-anchor="middle" fill="#0F2A43">500 m geofence</text>
      <rect x="360" y="246" width="152" height="32" rx="16" fill="#FFFFFF" stroke="#BFCCD6"/><text x="436" y="267" text-anchor="middle" fill="#0F2A43">About ₹800 / node</text>
    </g>
  </g>
</svg>
